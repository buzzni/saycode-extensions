name: Release fixture

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run verify:project-templates
      - run: npm run package:fixture
      - run: npm run package:project-templates
      - run: npm run package:plugin-manager
      - run: npm run package:artifact-publisher
      - name: Create checksum
        working-directory: examples/hello-world
        run: sha256sum *.saycode-extension > buzzni.hello-world-1.0.1.saycode-extension.sha256
      - name: Create project templates checksum
        working-directory: packages/project-templates
        run: sha256sum *.saycode-extension > buzzni.project-templates-1.0.1.saycode-extension.sha256
      - name: Create Plugin Manager checksum
        working-directory: packages/plugin-manager
        run: sha256sum *.saycode-extension > buzzni.plugin-manager-1.0.3.saycode-extension.sha256
      - name: Create Artifact Publisher checksum
        working-directory: packages/artifact-publisher
        run: sha256sum *.saycode-extension > buzzni.artifact-publisher-1.0.0.saycode-extension.sha256
      - name: Publish GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          examples/hello-world/buzzni.hello-world-1.0.1.saycode-extension
          examples/hello-world/buzzni.hello-world-1.0.1.saycode-extension.sha256
          packages/project-templates/buzzni.project-templates-1.0.1.saycode-extension
          packages/project-templates/buzzni.project-templates-1.0.1.saycode-extension.sha256
          packages/plugin-manager/buzzni.plugin-manager-1.0.3.saycode-extension
          packages/plugin-manager/buzzni.plugin-manager-1.0.3.saycode-extension.sha256
          packages/artifact-publisher/buzzni.artifact-publisher-1.0.0.saycode-extension
          packages/artifact-publisher/buzzni.artifact-publisher-1.0.0.saycode-extension.sha256
          --generate-notes
          --title "$GITHUB_REF_NAME"

  publish-sdk:
    # The SDK is the only package published to a public registry (ADR-046); first-party extensions ship as
    # release artifacts above. Runs only after the artifact release passes. The already-published skip makes
    # "Re-run failed jobs" on this job idempotent; a full re-run of an existing tag still fails earlier, in
    # the release job's `gh release create`.
    needs: release
    runs-on: ubuntu-latest
    # Publishing needs the npm token, not the GitHub write scope the release job uses.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the ancestry gate below can walk from the tag to main.
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        # A v* tag on any branch would otherwise run that branch's code with NPM_TOKEN in reach and publish
        # unreviewed bits to a permanent public registry.
        # The tag checkout configures a tag-only fetch refspec, so `git fetch origin main` would set only
        # FETCH_HEAD and leave `origin/main` unresolvable. Name the destination ref explicitly.
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Publish SDK to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run publish:sdk
