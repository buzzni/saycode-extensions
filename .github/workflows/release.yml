name: Release fixture

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run package:fixture
      - name: Create checksum
        working-directory: examples/hello-world
        run: sha256sum *.saycode-extension > buzzni.hello-world-1.0.0.saycode-extension.sha256
      - name: Publish GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          examples/hello-world/buzzni.hello-world-1.0.0.saycode-extension
          examples/hello-world/buzzni.hello-world-1.0.0.saycode-extension.sha256
          --generate-notes
          --title "$GITHUB_REF_NAME"
