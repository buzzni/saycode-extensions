name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @buzzni/saycode-extension-sdk
      - run: npm run typecheck -w @buzzni/saycode-extension-sdk
      - run: node --test tests/sdk.test.mjs tests/project-templates.test.mjs tests/project-template-release.test.mjs

  test-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @buzzni/saycode-extension-sdk
      - run: npm run build -w @buzzni/saycode-extension-test-host
      - run: npm run typecheck -w @buzzni/saycode-extension-test-host
      - run: npm run typecheck -w @buzzni/saycode-extension-telegram -w @buzzni/saycode-extension-slack -w @buzzni/saycode-extension-discord
      # Packaged adapters exercise the SDK contract inside the test host.
      - run: node --test tests/test-host.test.mjs tests/plugin-manager.test.mjs tests/telegram.test.mjs tests/slack.test.mjs tests/discord.test.mjs

  cli-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @buzzni/saycode-extension-sdk
      - run: node --test tests/cli.test.mjs tests/artifact-publisher.test.mjs
      - run: npm run package:fixture

  publish-contract:
    # Guards what gets published to a public registry (ADR-046). Without this the checks run for the first
    # time on a release tag, when the mistake is already expensive.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @buzzni/saycode-extension-sdk
      - run: node --test tests/npm-publish-gate.test.mjs tests/sdk-publish.test.mjs tests/ci-coverage.test.mjs
