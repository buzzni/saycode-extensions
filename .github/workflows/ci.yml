name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @buzzni/saycode-extension-sdk
      - run: npm run typecheck -w @buzzni/saycode-extension-sdk
      - run: node --test tests/sdk.test.mjs tests/project-templates.test.mjs tests/project-template-release.test.mjs

  test-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @buzzni/saycode-extension-sdk
      - run: npm run build -w @buzzni/saycode-extension-test-host
      - run: npm run typecheck -w @buzzni/saycode-extension-test-host
      # plugin-manager exercises a packaged extension inside the test host, so it belongs to this job's builds.
      - run: node --test tests/test-host.test.mjs tests/plugin-manager.test.mjs

  cli-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @buzzni/saycode-extension-sdk
      - run: node --test tests/cli.test.mjs tests/artifact-publisher.test.mjs tests/extension-catalog-signing.test.mjs
      - run: npm run package:fixture

  publish-contract:
    # Guards what gets published to a public registry (ADR-046). Without this the checks run for the first
    # time on a release tag, when the mistake is already expensive.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @buzzni/saycode-extension-sdk
      - run: node --test tests/npm-publish-gate.test.mjs tests/sdk-publish.test.mjs tests/ci-coverage.test.mjs
