<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document templates</title>
<style>
:root{color-scheme:light dark;font:14px system-ui;color:light-dark(#222,#eee);background:light-dark(#fafafa,#1c1c1f)}*{box-sizing:border-box}body{margin:0;padding:20px}button,input,select,textarea{font:inherit;color:inherit;background:light-dark(#fff,#29292e);border:1px solid light-dark(#ccc,#555);border-radius:7px;padding:9px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button[aria-pressed=true]{border:2px solid #7163e8}header,nav,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}h1{font-size:20px;margin:0 auto 0 0}h2{font-size:17px}main{display:grid;grid-template-columns:minmax(180px,1fr) minmax(260px,1fr);gap:20px}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;align-content:start;max-height:66vh;overflow:auto}.card{text-align:left;min-height:78px}.card small{display:block;margin-top:8px;opacity:.7}#preview{max-height:230px;max-width:100%;object-fit:contain;background:white;border-radius:5px}label{display:block;margin:12px 0 5px}input,textarea{width:100%}textarea{min-height:170px;resize:vertical}#notice{min-height:22px;white-space:pre-wrap}#notice[data-error=true]{color:light-dark(#ad2430,#ff929b)}.hint{opacity:.7;line-height:1.5}#details[hidden],form[hidden]{display:none}@media(max-width:600px){main{grid-template-columns:1fr}}
</style></head><body>
<header><h1 data-label="title"></h1><button id="reload" data-label="reload"></button></header>
<nav><select id="format" aria-label="Format"><option value="">DOCX · XLSX · PPTX · PDF</option><option>docx</option><option>xlsx</option><option>pptx</option><option>pdf</option></select><button id="new" data-label="new"></button></nav>
<p id="notice" role="status" aria-live="polite"></p>
<main><div id="cards"></div><section>
<div id="details" hidden><h2 id="name"></h2><img id="preview" alt=""><p id="description" class="hint"></p><div class="actions"><button id="apply" data-label="apply"></button><button id="edit" data-label="edit"></button><button id="remove" data-label="remove"></button></div></div>
<form id="editor" hidden><h2 data-label="manage"></h2><label for="titleInput" data-label="name"></label><input id="titleInput" maxlength="100" required><label for="instructions" data-label="instructions"></label><textarea id="instructions" maxlength="100000"></textarea><label for="preserve" data-label="preserve"></label><input id="preserve" maxlength="2000"><div class="actions"><button type="button" id="source" data-label="source"></button><span id="sourceName"></span></div><p class="hint" data-label="formats"></p><div class="actions"><button type="button" id="save" data-label="save"></button><button type="button" id="cancel" data-label="cancel"></button></div></form>
<p class="hint" data-label="hint"></p></section></main>
<script>
'use strict';
const messages={
en:{title:'Document templates',reload:'Reload',new:'Add personal template',apply:'Add to draft',edit:'Edit',remove:'Delete',manage:'Personal template',name:'Name',instructions:'Instructions',preserve:'What should stay unchanged?',source:'Choose source file',formats:'DOCX, XLSX or PPTX · up to 10 MiB. Replacement must use the same format.',save:'Save',cancel:'Cancel',hint:'Applying adds reference files and instructions. Your message is not sent. Personal originals are available only in private personal chats.',loading:'Loading…',empty:'No templates in this format.',saved:'Saved. Reloaded the catalog.',applied:'Added to the draft. Close this panel to review and send.',failed:'The operation did not finish. Your draft is unchanged. Reload to check the latest saved state before retrying.',private:'Personal',public:'Included',desc:'Create a new document from a copy of the retained reference. Preserve its layout and review the final render.',preview:'Preview unavailable',select:'Select a source file first.',privateOnly:'Open a private personal chat to apply this template.'},
ko:{title:'문서 템플릿',reload:'새로고침',new:'개인 양식 추가',apply:'초안에 추가',edit:'편집',remove:'삭제',manage:'개인 양식 관리',name:'이름',instructions:'제작 지침',preserve:'보존할 서식과 내용',source:'원본 파일 선택',formats:'DOCX, XLSX, PPTX · 최대 10 MiB. 교체 원본은 같은 형식이어야 합니다.',save:'저장',cancel:'취소',hint:'적용하면 참조 파일과 지침을 추가합니다. 메시지는 전송하지 않습니다. 개인 원본은 비공개 개인 대화에서만 사용할 수 있습니다.',loading:'불러오는 중…',empty:'이 형식의 템플릿이 없습니다.',saved:'저장 후 목록을 갱신했습니다.',applied:'초안에 추가했습니다. 패널을 닫고 검토한 뒤 전송하세요.',failed:'작업을 완료하지 못했습니다. 초안은 유지됩니다. 다시 시도하기 전에 새로고침으로 저장 상태를 확인하세요.',private:'개인',public:'기본 제공',desc:'보관된 참조 원본의 사본으로 문서를 만듭니다. 서식을 보존하고 최종 렌더링을 검수하세요.',preview:'미리보기를 불러오지 못했습니다.',select:'원본 파일을 먼저 선택하세요.',privateOnly:'비공개 개인 대화에서 이 양식을 적용하세요.'},
ja:{title:'文書テンプレート',reload:'再読み込み',new:'個人テンプレートを追加',apply:'下書きに追加',edit:'編集',remove:'削除',manage:'個人テンプレート',name:'名前',instructions:'作成指示',preserve:'保持する書式と内容',source:'原本を選択',formats:'DOCX・XLSX・PPTX、最大10 MiB。差し替えは同じ形式にしてください。',save:'保存',cancel:'キャンセル',hint:'参照と指示を追加します。メッセージは送信しません。個人原本は非公開の個人チャットでのみ使用できます。',loading:'読み込み中…',empty:'該当するテンプレートはありません。',saved:'保存して一覧を更新しました。',applied:'下書きに追加しました。パネルを閉じて確認してください。',failed:'完了できませんでした。下書きは保持されます。再試行前に再読み込みで保存状態を確認してください。',private:'個人',public:'標準',desc:'原本のコピーから作成し、書式を保持して完成品を確認します。',preview:'プレビューを読み込めません。',select:'原本を先に選択してください。',privateOnly:'非公開の個人チャットで適用してください。'},
zh:{title:'文档模板',reload:'刷新',new:'添加个人模板',apply:'添加到草稿',edit:'编辑',remove:'删除',manage:'个人模板',name:'名称',instructions:'制作说明',preserve:'需要保留的格式和内容',source:'选择原始文件',formats:'DOCX、XLSX、PPTX，最大10 MiB。替换文件须为相同格式。',save:'保存',cancel:'取消',hint:'应用后添加参考文件与说明，不会发送消息。个人原始文件仅可用于私人对话。',loading:'加载中…',empty:'没有该格式的模板。',saved:'已保存并刷新。',applied:'已添加到草稿，请关闭面板后检查。',failed:'操作未完成，草稿保持不变。请刷新确认保存状态后重试。',private:'个人',public:'内置',desc:'使用原始文件的副本制作文档，保留格式并检查最终效果。',preview:'无法加载预览。',select:'请先选择原始文件。',privateOnly:'请在私人对话中应用此模板。'}};
const language=new URL(location.href).searchParams.get('language')||'en',t=messages[language]||messages.en;
document.documentElement.lang=language;document.querySelectorAll('[data-label]').forEach(el=>el.textContent=t[el.dataset.label]);
const el=id=>document.getElementById(id);let rows=[],selected=null,generation=0,busy=false,editing=null,sourceHandle=null;
function notice(message,error=false){el('notice').textContent=message;el('notice').dataset.error=String(error)}
function send(input){return window.saycodePanel.invokeCommand('buzzni.document-templates.execute',[input])}
async function call(permission,action,args={}){const result=await send({permission,action,args});if(!result.ok)throw Error(result.error);return result.value}
function lock(value){busy=value;document.querySelectorAll('button,select,input,textarea').forEach(node=>node.disabled=value)}
async function run(task){if(busy)return;lock(true);notice(t.loading);try{await task()}catch(error){notice(t.failed+' '+String(error.message),true)}finally{lock(false)}}
async function read(handle){try{let offset=0,parts=[];for(;;){const chunk=await call('assets.read','readChunk',{handle,offset});parts.push(chunk.contentBase64);offset=chunk.nextOffset;if(chunk.done)break;if(offset>10485760)throw Error('SIZE_LIMIT')}return parts.map(part=>atob(part)).join('')}finally{await call('assets.read','close',{handle}).catch(()=>{})}}
function draw(){el('cards').replaceChildren();const format=el('format').value;for(const row of rows.filter(row=>!format||row.format===format)){const button=document.createElement('button');button.className='card';button.setAttribute('aria-pressed',String(selected?.id===row.id));const title=document.createElement('span');title.textContent=row.name;const info=document.createElement('small');info.textContent=row.format.toUpperCase()+' · '+t[row.personal?'private':'public'];button.append(title,info);button.onclick=()=>run(()=>choose(row));el('cards').append(button)}if(!el('cards').children.length)el('cards').textContent=t.empty}
async function refresh(){const catalog=await send('catalog');rows=catalog.map(row=>({...row,personal:false}));let cursor;try{do{const page=await call('assets.read','list',cursor===undefined?{}:{cursor});rows.push(...page.templates.map(row=>({...row,personal:true})));cursor=page.cursor}while(cursor!==null)}catch(error){draw();throw error}draw()}
async function choose(row){const epoch=++generation;selected=row;editing=null;el('editor').hidden=true;el('details').hidden=false;el('name').textContent=row.name;el('description').textContent=t.desc;el('preview').removeAttribute('src');el('preview').alt=t.preview;el('edit').hidden=el('remove').hidden=!row.personal;draw();if(row.personal){Object.assign(row,await call('assets.read','describe',{id:row.id}))}try{const file=await call('assets.read','open',row.personal?{id:row.id,revision:row.revision,role:'preview'}:{path:`assets/${row.id}/preview.png`});const image=await read(file.handle);if(epoch===generation){el('preview').src='data:image/png;base64,'+btoa(image);el('preview').alt=row.name;notice('')}}catch(error){if(epoch===generation)notice(t.preview,true)}}
// The server regenerates the source analysis (heading line + one JSON-object line) on save; everything else is the user's to edit.
const ANALYSIS_HEADING='\n## 원본 구조 분석 ';function isJsonObject(line){try{const value=JSON.parse(line);return typeof value==='object'&&value!==null&&!Array.isArray(value)}catch{return false}}function userInstructions(text){for(let at=text.indexOf(ANALYSIS_HEADING);at>=0;at=text.indexOf(ANALYSIS_HEADING,at+1)){const lines=text.slice(at+1).split('\n');if(!isJsonObject(lines[1]??''))continue;const trailing=lines.slice(2).join('\n').trim(),before=text.slice(0,at).trimEnd();return trailing?before+'\n\n'+trailing:before}return text.trimEnd()}
async function edit(row){editing=row;sourceHandle=null;el('sourceName').textContent='';el('details').hidden=true;el('editor').hidden=false;el('titleInput').value=row?.name||'';el('preserve').value='';el('preserve').hidden=!!row;el('instructions').hidden=!row;el('instructions').value='';if(row){const file=await call('assets.read','open',{id:row.id,revision:row.revision,role:'instructions'});const binary=await read(file.handle);el('instructions').value=userInstructions(new TextDecoder().decode(Uint8Array.from(binary,c=>c.charCodeAt(0))))}notice('')}
// The panel is an opaque-origin iframe (not a secure context), so crypto.subtle is unavailable.
function sha256Hex(bytes){const k=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);const h=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]),length=bytes.length,padded=new Uint8Array(((length+9+63)>>6)<<6);padded.set(bytes);padded[length]=0x80;const view=new DataView(padded.buffer);view.setUint32(padded.length-8,Math.floor(length/0x20000000));view.setUint32(padded.length-4,length<<3>>>0);const w=new Uint32Array(64),r=(x,n)=>x>>>n|x<<32-n;for(let offset=0;offset<padded.length;offset+=64){for(let i=0;i<16;i++)w[i]=view.getUint32(offset+i*4);for(let i=16;i<64;i++)w[i]=(r(w[i-2],17)^r(w[i-2],19)^w[i-2]>>>10)+w[i-7]+(r(w[i-15],7)^r(w[i-15],18)^w[i-15]>>>3)+w[i-16];let[a,b,c,d,e,f,g,hh]=h;for(let i=0;i<64;i++){const t1=hh+(r(e,6)^r(e,11)^r(e,25))+(e&f^~e&g)+k[i]+w[i]>>>0,t2=(r(a,2)^r(a,13)^r(a,22))+(a&b^a&c^b&c)>>>0;hh=g;g=f;f=e;e=d+t1>>>0;d=c;c=b;b=a;a=t1+t2>>>0}h[0]+=a;h[1]+=b;h[2]+=c;h[3]+=d;h[4]+=e;h[5]+=f;h[6]+=g;h[7]+=hh}return Array.from(h,x=>x.toString(16).padStart(8,'0')).join('')}
async function instructionsHandle(text){const bytes=new TextEncoder().encode(text),upload=await call('assets.write','begin');for(let offset=0;offset<bytes.length;offset+=24576){const part=bytes.subarray(offset,offset+24576);await call('assets.write','writeChunk',{handle:upload.handle,offset,contentBase64:btoa(String.fromCharCode(...part))})}return (await call('assets.write','seal',{handle:upload.handle,sha256:sha256Hex(bytes)})).handle}
el('reload').onclick=()=>run(async()=>{await refresh();notice('')});el('format').onchange=draw;
el('new').onclick=()=>run(()=>edit(null));el('edit').onclick=()=>run(()=>edit(selected));
el('cancel').onclick=()=>run(async()=>{if(sourceHandle)await call('files.select','close',{handle:sourceHandle});sourceHandle=null;el('editor').hidden=true;if(selected)await choose(selected);else notice('')});
el('source').onclick=()=>run(async()=>{const file=await call('files.select','pick',{purpose:'asset-source'});if(!file.cancelled){if(sourceHandle)await call('files.select','close',{handle:sourceHandle});sourceHandle=file.handle;el('sourceName').textContent=file.name}notice('')});
el('editor').onsubmit=event=>event.preventDefault();el('save').onclick=()=>{if(!el('titleInput').reportValidity())return;run(async()=>{const name=el('titleInput').value.trim();let result;if(editing){const handle=await instructionsHandle(el('instructions').value);result=await call('assets.write','update',{id:editing.id,expectedRevision:editing.revision,name,instructionHandle:handle,...(sourceHandle?{sourceHandle}:{})})}else{if(!sourceHandle)throw Error(t.select);result=await call('assets.write','create',{name,sourceHandle,preserve:el('preserve').value})}sourceHandle=null;selected=null;el('editor').hidden=true;el('details').hidden=true;await refresh();notice([t.saved,...result.warnings].join('\n'))})};
el('remove').onclick=()=>run(async()=>{await call('assets.write','remove',{id:selected.id,expectedRevision:selected.revision});selected=null;el('details').hidden=true;await refresh();notice(t.saved)});
el('apply').onclick=()=>run(async()=>{const row=selected,context=await call('drafts.prepare','context');if(row.personal&&!context.private)throw Error(t.privateOnly);const handles=[];let preparation;try{for(const role of ['source','instructions']){const file=await call('assets.read','open',row.personal?{id:row.id,revision:row.revision,role}:{path:`assets/${row.id}/${role==='source'?'reference.'+row.referenceFormat:'instructions.md'}`});handles.push(file.handle)}const text=`Create a ${row.format.toUpperCase()} document using the attached reference and instructions for ${row.name}. Read the actual attachment paths supplied with this message, rather than any legacy workspace paths in the instructions. Work on a copy, preserve the original layout and editable objects, verify the final render, and return the finished file. Stop and report missing tools or files; never substitute an unrelated template.`;preparation=await call('drafts.prepare','prepare',{targetId:context.targetId,revision:context.revision,text,handles});await call('drafts.prepare','commit',{preparationId:preparation.preparationId});notice(t.applied)}catch(error){if(preparation)await call('drafts.prepare','cancel',{preparationId:preparation.preparationId}).catch(()=>{});for(const handle of handles)await call('assets.read','close',{handle}).catch(()=>{});throw error}});
window.saycodePanel.ready.then(()=>run(async()=>{await refresh();notice('')}));
</script></body></html>
