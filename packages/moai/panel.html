<style>
  :root { color-scheme: light dark; font: 14px/1.45 system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; color: CanvasText; background: Canvas; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p { margin: 6px 0; color: GrayText; }
  section { display: grid; gap: 8px; margin-top: 16px; padding: 12px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 8px; }
  .row { display: flex; align-items: center; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid ButtonBorder; border-radius: 7px; font: inherit; }
  button { padding: 7px 12px; border: 1px solid ButtonBorder; border-radius: 7px; font: inherit; }
  #result { color: CanvasText; overflow-wrap: anywhere; }
  #error { color: #c33; overflow-wrap: anywhere; }
  /* Empty lines would leave a gap below the controls. */
  #status:empty, #result:empty, #error:empty { display: none; }
</style>
<h1 id="title"></h1>
<p id="hint"></p>
<section>
  <div class="row">
    <button id="check" type="button"></button>
    <button id="cancel" type="button"></button>
  </div>
  <div class="row">
    <input id="task" maxlength="512" autocomplete="off">
    <button id="add" type="button"></button>
  </div>
  <p id="status" role="status"></p>
  <p id="result"></p>
  <p id="error" role="alert"></p>
</section>
<script>
(() => {
  const translations = {
    en: {
      title: 'Moai board', hint: 'Runs in the project selected in the app. Before each run, a confirmation shows the machine and folder.',
      check: 'Show status', cancel: 'Cancel', placeholder: 'New task title', add: 'Add task',
      running: 'Running on the machine…', mayContinue: 'Processes on the machine may not have finished yet.', cancelled: 'The run was cancelled.', titleRequired: 'Enter a task title.',
      counts: (c) => `To do ${c.todo} · In progress ${c.in_progress} · Review ${c.review} · Done ${c.done}`,
      added: (t) => `Added: ${t.title} (${t.id})`,
      notStarted: 'The run did not start. It may have been declined, or this machine does not support Moai yet.',
      moaiError: (message) => `Moai reported an error: ${message}`, failed: 'The run failed.', unreadable: 'The run finished, but its result could not be read.',
      notInitialized: 'This project has no Moai board yet. On that machine, run `moai init` once in the project folder, then try again.',
    },
    ko: {
      title: 'Moai 작업 보드', hint: '앱에서 선택한 프로젝트에서 실행됩니다. 실행할 때마다 머신과 폴더를 보여주는 확인 창이 뜹니다.',
      check: '상태 보기', cancel: '취소', placeholder: '새 할 일 제목', add: '할 일 추가',
      running: '머신에서 실행하는 중…', mayContinue: '머신에서 프로세스가 아직 끝나지 않았을 수 있습니다.', cancelled: '실행을 취소했습니다.', titleRequired: '할 일 제목을 입력하세요.',
      counts: (c) => `할 일 ${c.todo} · 진행 중 ${c.in_progress} · 검토 ${c.review} · 완료 ${c.done}`,
      added: (t) => `추가했습니다: ${t.title} (${t.id})`,
      notStarted: '실행이 시작되지 않았습니다. 확인 창에서 거부했거나, 이 머신이 아직 Moai를 지원하지 않을 수 있습니다.',
      moaiError: (message) => `Moai 오류: ${message}`, failed: '실행에 실패했습니다.', unreadable: '실행은 끝났지만 결과를 읽지 못했습니다.',
      notInitialized: '이 프로젝트에는 아직 Moai 보드가 없습니다. 그 머신의 프로젝트 폴더에서 `moai init`을 한 번 실행한 뒤 다시 시도하세요.',
    },
    ja: {
      title: 'Moai 作業ボード', hint: 'アプリで選択したプロジェクトで実行します。実行のたびに、マシンとフォルダを示す確認画面が表示されます。',
      check: '状態を表示', cancel: 'キャンセル', placeholder: '新しいタスクのタイトル', add: 'タスクを追加',
      running: 'マシンで実行中…', mayContinue: 'マシン上のプロセスはまだ終了していない可能性があります。', cancelled: '実行をキャンセルしました。', titleRequired: 'タスクのタイトルを入力してください。',
      counts: (c) => `未着手 ${c.todo} · 進行中 ${c.in_progress} · レビュー ${c.review} · 完了 ${c.done}`,
      added: (t) => `追加しました: ${t.title} (${t.id})`,
      notStarted: '実行が開始されませんでした。確認画面で拒否されたか、このマシンがまだ Moai に対応していない可能性があります。',
      moaiError: (message) => `Moai のエラー: ${message}`, failed: '実行に失敗しました。', unreadable: '実行は完了しましたが、結果を読み取れませんでした。',
      notInitialized: 'このプロジェクトにはまだ Moai ボードがありません。そのマシンのプロジェクトフォルダで `moai init` を一度実行してから、もう一度お試しください。',
    },
    zh: {
      title: 'Moai 任务看板', hint: '在应用中选择的项目里运行。每次运行前都会显示机器和文件夹的确认窗口。',
      check: '查看状态', cancel: '取消', placeholder: '新任务标题', add: '添加任务',
      running: '正在机器上运行…', mayContinue: '机器上的进程可能尚未结束。', cancelled: '已取消运行。', titleRequired: '请输入任务标题。',
      counts: (c) => `待办 ${c.todo} · 进行中 ${c.in_progress} · 审核 ${c.review} · 完成 ${c.done}`,
      added: (t) => `已添加: ${t.title} (${t.id})`,
      notStarted: '运行未开始。可能在确认窗口中被拒绝，或此机器尚不支持 Moai。',
      moaiError: (message) => `Moai 错误: ${message}`, failed: '运行失败。', unreadable: '运行已结束，但无法读取结果。',
      notInitialized: '此项目还没有 Moai 看板。请在该机器的项目文件夹中运行一次 `moai init`，然后重试。',
    },
  };
  const language = (document.documentElement.lang || navigator.language || 'en').split('-')[0];
  const copy = translations[language] || translations.en;
  const el = Object.fromEntries(['title', 'hint', 'check', 'task', 'add', 'cancel', 'status', 'error', 'result']
    .map((id) => [id, document.getElementById(id)]));
  el.title.textContent = copy.title;
  el.hint.textContent = copy.hint;
  el.check.textContent = copy.check;
  el.cancel.textContent = copy.cancel;
  el.add.textContent = copy.add;
  el.task.placeholder = copy.placeholder;

  const POLL_MS = 500;
  // The board needs `moai init`, which this extension deliberately cannot run.
  const NOT_A_REPOSITORY = /Not a moai repository/;
  let operationId = null;
  let busy = false;

  function sync() {
    el.check.disabled = busy;
    el.add.disabled = busy;
    el.task.disabled = busy;
    el.cancel.hidden = !busy;
    el.cancel.disabled = !operationId;
  }
  sync();

  function parse(stdout) {
    try { return JSON.parse(stdout); } catch { return null; }
  }

  async function poll(id) {
    for (;;) {
      const result = await window.saycodePanel.invokeCommand('buzzni.moai.status', [id]);
      if (!result || result.state !== 'running') return result;
      await new Promise((resolve) => setTimeout(resolve, POLL_MS));
    }
  }

  async function run(args, onPassed) {
    if (busy) return;
    busy = true;
    operationId = null;
    el.error.textContent = '';
    el.result.textContent = '';
    el.status.textContent = copy.running;
    sync();
    try {
      let started;
      try {
        started = await window.saycodePanel.invokeCommand('buzzni.moai.run', args);
      } catch {
        el.error.textContent = copy.notStarted;
        return;
      }
      if (!started || started.state !== 'accepted' || typeof started.operationId !== 'string') {
        el.error.textContent = copy.notStarted;
        return;
      }
      operationId = started.operationId;
      sync();
      const finished = await poll(started.operationId);
      const output = finished ? parse(finished.stdout || '') : null;
      // The runner may never report a cancelled group reaped, so do not wait for it; the daemon's
      // workspace write lock refuses an overlapping write until the old group settles.
      if (finished && finished.state === 'cancelled') el.status.textContent = finished.remoteMayContinue === true ? `${copy.cancelled} ${copy.mayContinue}` : copy.cancelled;
      else if (finished && finished.state === 'passed') {
        if (output) onPassed(output); else el.error.textContent = copy.unreadable;
      } else {
        // Moai prints its JSON error on stderr.
        const problem = (finished && parse(finished.stderr || '')) || output;
        const reason = problem && typeof problem.error === 'string' ? problem.error : null;
        el.error.textContent = reason && NOT_A_REPOSITORY.test(reason) ? copy.notInitialized : reason ? copy.moaiError(reason) : copy.failed;
      }
    } catch {
      el.error.textContent = copy.failed;
    } finally {
      if (el.status.textContent === copy.running) el.status.textContent = '';
      busy = false;
      operationId = null;
      sync();
    }
  }

  el.check.addEventListener('click', () => void run(['buzzni.moai.status'], (output) => {
    const counts = output && output.counts;
    // Outside a `.moai/` repository, status lists the user's projects instead of a board.
    if (!counts) { el.error.textContent = Array.isArray(output && output.projects) ? copy.notInitialized : copy.unreadable; return; }
    el.result.textContent = copy.counts(counts);
  }));

  function add() {
    const title = (el.task.value || '').trim();
    if (!title) { el.error.textContent = copy.titleRequired; return; }
    void run(['buzzni.moai.add', title], (output) => {
      if (!output || typeof output.id !== 'string') { el.error.textContent = copy.unreadable; return; }
      el.result.textContent = copy.added(output);
      el.task.value = '';
    });
  }
  el.add.addEventListener('click', add);
  // The panel iframe has no allow-forms, so a form would never submit; Enter is handled here (not while an IME composes).
  el.task.addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.isComposing) { event.preventDefault(); add(); } });

  el.cancel.addEventListener('click', () => {
    if (!operationId) return;
    void window.saycodePanel.invokeCommand('buzzni.moai.cancel', [operationId]).catch(() => {});
  });
})();
</script>
