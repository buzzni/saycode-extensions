<style>
  /* Panel theme v1: Desktop injects --saycode-* and data-theme; older hosts fall back to the OS scheme. */
  :root {
    color-scheme: light;
    --fb-bg: #FFFFFF; --fb-surface: #F4F4F5; --fb-text: #09090B; --fb-muted: #52525B; --fb-border: #DCDCE0;
    --fb-accent: #1B64DA; --fb-accent-contrast: #FFFFFF; --fb-danger: #DC2626;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --fb-bg: #13161A; --fb-surface: #22252C; --fb-text: #FAFAFA; --fb-muted: #A1A1AA; --fb-border: #3E424D;
      --fb-accent: #2470E4; --fb-accent-contrast: #FFFFFF; --fb-danger: #F87171;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --fb-bg: #13161A; --fb-surface: #22252C; --fb-text: #FAFAFA; --fb-muted: #A1A1AA; --fb-border: #3E424D;
    --fb-accent: #2470E4; --fb-accent-contrast: #FFFFFF; --fb-danger: #F87171;
  }
  /* Resolved per element so the host values apply wherever Desktop sets them. */
  * {
    box-sizing: border-box;
    --bg: var(--saycode-bg, var(--fb-bg));
    --surface: var(--saycode-surface, var(--fb-surface));
    --text: var(--saycode-text, var(--fb-text));
    --muted: var(--saycode-text-muted, var(--fb-muted));
    --border: var(--saycode-border, var(--fb-border));
    --accent: var(--saycode-accent, var(--fb-accent));
    --accent-contrast: var(--saycode-accent-contrast, var(--fb-accent-contrast));
    --danger: var(--saycode-danger, var(--fb-danger));
    --radius: var(--saycode-radius, 10px);
  }
  body {
    margin: 0; padding: 16px 20px 20px;
    font: 13px/1.5 var(--saycode-font, system-ui, -apple-system, "Segoe UI", sans-serif);
    color: var(--text); background: var(--bg);
  }
  .lead { margin: 0 0 14px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; }
  .row + .row { margin-top: 10px; }
  input {
    flex: 1; min-width: 0; height: 34px; padding: 0 10px;
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius); outline: none;
  }
  input::placeholder { color: var(--muted); }
  input:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  button {
    flex: none; height: 34px; padding: 0 14px;
    font: inherit; font-weight: 500; border-radius: var(--radius); cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled, input:disabled { opacity: 0.5; cursor: default; }
  .primary { color: var(--accent-contrast); background: var(--accent); border: 1px solid var(--accent); }
  .primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, #000); }
  /* Bordered secondary: hover tints only the border. */
  .secondary { color: var(--text); background: transparent; border: 1px solid var(--border); }
  .secondary:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
  .activity { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); }
  .spinner {
    flex: none; width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-color: var(--accent); } }
  #status { margin: 0; overflow-wrap: anywhere; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 14px 0 0; padding: 0; list-style: none; }
  .stats li { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; background: var(--surface); border-radius: var(--radius); }
  .stat-value { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 12px; color: var(--muted); }
  @media (max-width: 360px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  #result { margin: 12px 0 0; overflow-wrap: anywhere; }
  .banner {
    margin: 12px 0 0; padding: 10px 12px; border-radius: var(--radius); overflow-wrap: anywhere;
    border: 1px solid var(--tone); background: color-mix(in srgb, var(--tone) 8%, var(--bg));
  }
  .banner.info { --tone: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .banner.danger { --tone: color-mix(in srgb, var(--danger) 55%, var(--border)); color: var(--danger); }
  code {
    padding: 1px 5px; border-radius: 5px; white-space: nowrap; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: color-mix(in srgb, var(--text) 8%, transparent);
  }
  /* Task list and detail share the panel; the detail replaces the list in place. */
  .board { margin: 16px 0 0; }
  .group + .group { margin-top: 14px; }
  .group-head { display: flex; align-items: baseline; gap: 6px; margin: 0 0 6px; }
  .group h2 { margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); }
  .group-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tasks { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
  button.task {
    display: flex; align-items: center; gap: 10px; width: 100%; height: auto; min-height: 38px; padding: 8px 12px;
    text-align: left; font-weight: 400; color: var(--text); background: transparent; border: 1px solid var(--border);
  }
  button.task:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
  .task-title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .task-id, .journal-meta { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .more, .empty { margin: 10px 0 0; color: var(--muted); }
  .detail { margin: 16px 0 0; }
  button.link { height: 28px; padding: 0 8px; margin: 0 0 8px -8px; color: var(--accent); background: transparent; border: 0; }
  button.link:hover:not(:disabled) { text-decoration: underline; }
  .detail h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .detail h3 { margin: 16px 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0; }
  .meta dt { color: var(--muted); }
  .meta dd { margin: 0; overflow-wrap: anywhere; }
  .body { margin: 12px 0 0; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--border); border-radius: var(--radius); }
  .children, .journal { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .journal li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
  .journal-text { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .children .empty { margin: 0; }
  /* Empty lines would leave a gap below the controls. */
  #status:empty, #result:empty, #error:empty { display: none; }
  [hidden] { display: none !important; }
</style>
<p class="lead" id="hint"></p>
<div class="row">
  <input id="task" maxlength="512" autocomplete="off">
  <button id="add" class="primary" type="button"></button>
</div>
<div class="row">
  <button id="refresh" class="secondary" type="button"></button>
  <button id="check" class="secondary" type="button"></button>
  <div class="activity">
    <span id="spinner" class="spinner" aria-hidden="true" hidden></span>
    <p id="status" role="status"></p>
  </div>
  <button id="cancel" class="secondary" type="button" hidden></button>
</div>
<ul id="counts" class="stats" hidden></ul>
<p id="result"></p>
<div id="notice" class="banner info" role="status" hidden></div>
<p id="error" class="banner danger" role="alert"></p>
<section id="board" class="board"></section>
<section id="detail" class="detail" hidden>
  <button id="back" class="link" type="button"></button>
  <h2 id="detail-title"></h2>
  <dl id="detail-meta" class="meta"></dl>
  <p id="detail-body" class="body" hidden></p>
  <h3 id="children-heading"></h3>
  <ul id="detail-children" class="children" aria-labelledby="children-heading"></ul>
  <h3 id="journal-heading"></h3>
  <ol id="detail-journal" class="journal" aria-labelledby="journal-heading"></ol>
</section>

      notInitialized: ['このプロジェクトにはまだ Moai ボードがありません。そのマシンのプロジェクトフォルダで ', ' を一度実行してから、もう一度お試しください。moai が見つからない場合は、設定 → 拡張機能のマシンツールに表示される Moai のパスから実行してください。'],
    },

      fields: { status: '状态', priority: '优先级', assignee: '负责人', created: '创建时间', id: 'ID' },
      children: '子任务', noChildren: '无子任务', journal: '记录', createdEntry: '已创建',

  const copy = translations[language] || translations.en;
  const el = Object.fromEntries(['hint', 'check', 'refresh', 'task', 'add', 'cancel', 'spinner', 'status', 'counts', 'result', 'notice', 'error',

  el.hint.textContent = copy.hint;
  el.check.textContent = copy.check;
  el.refresh.textContent = copy.refresh;
  el.back.textContent = copy.back;
  el.board.setAttribute('aria-label', copy.board);
  el['children-heading'].textContent = copy.children;
  el['journal-heading'].textContent = copy.journal;
  el.cancel.textContent = copy.cancel;
  el.add.textContent = copy.add;
  el.task.placeholder = copy.placeholder;

  const POLL_MS = 500;
  // The board needs `moai init`, which this extension deliberately cannot run.
  const NOT_A_REPOSITORY = /Not a moai repository/;
  const INIT_COMMAND = 'moai init';
  let operationId = null;
  let busy = false;

  function sync() {
    el.check.disabled = busy;
    el.refresh.disabled = busy;
    el.back.disabled = busy;
    for (const button of el.board.querySelectorAll('button')) button.disabled = busy;
    el.add.disabled = busy;
    el.task.disabled = busy;
    el.spinner.hidden = !busy;
    // Nothing to cancel while the confirmation is still open: the run has no operation id yet.
    el.cancel.hidden = !(busy && operationId);
    el.cancel.disabled = !operationId;
  }
  sync();

  // Refusals the user chose or can simply retry are information; the rest are errors.
  const INFO_REFUSALS = new Set(['declined', 'approval-timeout', 'workspace-busy']);

  function showNotice(text) {
    el.notice.replaceChildren(text);
    el.notice.hidden = false;
  }

  function showInitGuidance() {
    const command = document.createElement('code');
    command.textContent = INIT_COMMAND;
    showNotice(copy.notInitialized[0]);
    el.notice.append(command, copy.notInitialized[1]);
  }

  function showCounts(counts) {
    el.counts.replaceChildren(...['todo', 'in_progress', 'review', 'done'].map((key) => {
      const chip = document.createElement('li');
      const value = document.createElement('span');
      const label = document.createElement('span');
      value.className = 'stat-value';
      label.className = 'stat-label';
      value.textContent = String(counts[key] ?? 0);
      label.textContent = copy.stats[key];
      chip.append(value, label);
      return chip;
    }));
    el.counts.hidden = false;
  }

  function clearOutput() {
    el.error.textContent = '';
    el.result.textContent = '';
    el.notice.replaceChildren();
    el.notice.hidden = true;
    el.counts.replaceChildren();
    el.counts.hidden = true;
  }

  function parse(stdout) {
    try { return JSON.parse(stdout); } catch { return null; }
  }

  async function poll(id) {
    for (;;) {
      const result = await window.saycodePanel.invokeCommand('buzzni.moai.status', [id]);
      if (!result || result.state !== 'running') return result;
      await new Promise((resolve) => setTimeout(resolve, POLL_MS));
    }
  }

  async function run(args, onPassed) {
    if (busy) return;
    busy = true;
    operationId = null;
    clearOutput();
    // Until the run is accepted Desktop may be showing its confirmation; nothing runs on the machine yet.
    el.status.textContent = copy.starting;
    sync();
    try {
      let started;
      try {
        started = await window.saycodePanel.invokeCommand('buzzni.moai.run', args);
      } catch {
        el.error.textContent = copy.notStarted;
        return;
      }
      const refusal = started && started.state === 'refused' && Object.hasOwn(copy.refused, started.code) ? started.code : null;
      if (refusal) {
        if (INFO_REFUSALS.has(refusal)) showNotice(copy.refused[refusal]); else el.error.textContent = copy.refused[refusal];
        return;
      }
      if (!started || started.state !== 'accepted' || typeof started.operationId !== 'string') {
        el.error.textContent = copy.notStarted;
        return;
      }
      operationId = started.operationId;
      el.status.textContent = copy.running;
      sync();
      const finished = await poll(started.operationId);
      const output = finished ? parse(finished.stdout || '') : null;
      // The runner may never report a cancelled group reaped, so do not wait for it; the daemon's
      // workspace write lock refuses an overlapping write until the old group settles.
      if (finished && finished.state === 'cancelled') el.status.textContent = finished.remoteMayContinue === true ? `${copy.cancelled} ${copy.mayContinue}` : copy.cancelled;
      else if (finished && finished.state === 'passed') {
        if (output) onPassed(output); else el.error.textContent = copy.unreadable;
      } else {
        // Moai prints its JSON error on stderr.
        const problem = (finished && parse(finished.stderr || '')) || output;
        const reason = problem && typeof problem.error === 'string' ? problem.error : null;
        if (reason && NOT_A_REPOSITORY.test(reason)) showInitGuidance();
        else el.error.textContent = reason ? copy.moaiError(reason) : copy.failed;
      }
    } catch {
      el.error.textContent = copy.failed;
    } finally {
      if (el.status.textContent === copy.running || el.status.textContent === copy.starting) el.status.textContent = '';
      busy = false;
      operationId = null;
      sync();
    }
  }

  function node(tag, className, text) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (text !== undefined) element.textContent = text;
    return element;
  }

  const items = (list) => (Array.isArray(list) ? list : []).filter((item) => item && typeof item.id === 'string');

  // prime lists what is held (picked: yours, others: other people's) and what can be picked up (ready); done tasks are not listed.
  function renderBoard(output) {
    const held = [...items(output.picked), ...items(output.others)];
    const groups = [
      ['in_progress', held.filter((item) => item.status === 'in_progress')],
      ['review', held.filter((item) => item.status === 'review')],
      ['todo', items(output.ready)],
    ].filter(([, list]) => list.length);
    const sections = groups.map(([key, list]) => {
      const section = node('section', 'group');
      const head = node('div', 'group-head');
      head.append(node('h2', '', copy.stats[key]), node('span', 'group-count', String(list.length)));
      const tasks = node('ul', 'tasks');
      tasks.append(...list.map((item) => {
        const button = node('button', 'task');
        button.type = 'button';
        button.dataset.id = item.id;
        button.append(node('span', 'task-title', String(item.title || item.id)), node('span', 'task-id', item.id));
        button.addEventListener('click', () => void openTask(item.id));
        const entry = node('li');
        entry.append(button);
        return entry;
      }));
      section.append(head, tasks);
      return section;
    });
    const hidden = (Number(output.rest) || 0) + (Number(output.others_rest) || 0);
    el.board.replaceChildren(...sections, ...(sections.length ? [] : [node('p', 'empty', copy.empty)]), ...(hidden > 0 ? [node('p', 'more', copy.more(hidden))] : []));
    sync();
  }

  function loadBoard() {
    return run(['buzzni.moai.prime'], (output) => {
      // Outside a `.moai/` repository prime reports no tracker instead of failing.
      if (output.no_tracker === true) { el.board.replaceChildren(); showInitGuidance(); return; }
      renderBoard(output);
    });
  }

  function dateText(value) {
    const date = new Date(value);
    return typeof value === 'string' && !Number.isNaN(date.getTime()) ? date.toLocaleString(language) : '';
  }

  function journalText(entry) {
    if (entry.kind === 'create') return copy.createdEntry;
    if (entry.kind === 'note' && typeof entry.text === 'string') return entry.text;
    if (entry.kind === 'status') return `${copy.stats[entry.from] || entry.from} → ${copy.stats[entry.to] || entry.to}`;
    return String(entry.text || entry.kind || '');
  }

  function renderDetail(task) {
    el['detail-title'].textContent = String(task.title || task.id);
    const fields = [
      ['status', copy.stats[task.status] || task.status],
      ['priority', task.priority === undefined || task.priority === null ? '' : `P${task.priority}`],
      ['assignee', task.assignee || ''],
      ['created', dateText(task.created_at)],
      ['id', task.id],
    ].filter(([, value]) => value);
    el['detail-meta'].replaceChildren(...fields.flatMap(([key, value]) => [node('dt', '', copy.fields[key]), node('dd', '', String(value))]));
    const body = typeof task.body === 'string' ? task.body : '';
    el['detail-body'].textContent = body;
    el['detail-body'].hidden = !body;
    const children = items(task.children);
    el['detail-children'].replaceChildren(...(children.length
      ? children.map((child) => node('li', '', `${child.title || child.id} (${child.id})`))
      : [node('li', 'empty', copy.noChildren)]));
    el['detail-journal'].replaceChildren(...(Array.isArray(task.journal) ? task.journal : []).map((entry) => {
      const item = node('li');
      const meta = [entry.by, dateText(entry.ts)].filter(Boolean).join(' · ');
      item.append(node('span', 'journal-text', journalText(entry)), node('span', 'journal-meta', meta));
      return item;
    }));
  }

  let openedFrom = null;
  function openTask(id) {
    return run(['buzzni.moai.show', id], (output) => {
      if (typeof output.id !== 'string') { el.error.textContent = copy.unreadable; return; }
      openedFrom = id;
      renderDetail(output);
      el.board.hidden = true;
      el.detail.hidden = false;
    }).then(() => {
      // Back is disabled until the run settles, so focus moves only then.
      if (!el.detail.hidden) el.back.focus();
    });
  }

  el.back.addEventListener('click', () => {
    el.detail.hidden = true;
    el.board.hidden = false;
    const origin = [...el.board.querySelectorAll('button.task')].find((button) => button.dataset.id === openedFrom);
    (origin || el.refresh).focus();
  });

  el.refresh.addEventListener('click', () => {
    el.detail.hidden = true;
    el.board.hidden = false;
    void loadBoard();
  });

  el.check.addEventListener('click', () => void run(['buzzni.moai.status'], (output) => {
    const counts = output && output.counts;
    // Outside a `.moai/` repository, status lists the user's projects instead of a board.
    if (!counts) {
      if (Array.isArray(output && output.projects)) showInitGuidance(); else el.error.textContent = copy.unreadable;
      return;
    }
    showCounts(counts);
  }));

  function add() {
    const title = (el.task.value || '').trim();
    if (!title) { el.error.textContent = copy.titleRequired; return; }
    let added = null;
    void run(['buzzni.moai.add', title], (output) => {
      if (!output || typeof output.id !== 'string') { el.error.textContent = copy.unreadable; return; }
      added = copy.added(output);
      el.result.textContent = added;
      el.task.value = '';
    }).then(async () => {
      if (!added) return;
      el.detail.hidden = true;
      el.board.hidden = false;
      await loadBoard();
      // The refresh starts a new run, which clears the previous result line.
      if (!el.error.textContent) el.result.textContent = added;
    });
  }
  el.add.addEventListener('click', add);
  // The panel iframe has no allow-forms, so a form would never submit; Enter is handled here (not while an IME composes).
  el.task.addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.isComposing) { event.preventDefault(); add(); } });

  el.cancel.addEventListener('click', () => {
    if (!operationId) return;
    void window.saycodePanel.invokeCommand('buzzni.moai.cancel', [operationId]).catch(() => {});
  });

  // Opening the board shows the project's tasks; the first read of a session asks Desktop's confirmation.
  void loadBoard();
})();
</script>
